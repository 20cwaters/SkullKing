services:
  - type: web
    name: skull-king
    runtime: node
    plan: free
    rootDir: .
    # Builds the shared logic package, the server, and the client — the server then serves
    # the built client as static files, so this is the only service you need.
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
    healthCheckPath: /health
