services:
  - type: web
    name: skull-king-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: CLIENT_ORIGIN
        value: https://skull-king-client.onrender.com
    healthCheckPath: /health

  - type: web
    name: skull-king-client
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://skull-king-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
